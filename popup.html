<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AdFree Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">AdFree</div>
    <div class="version">Pro 1.0</div>
  </div>

  <div class="stats">
    <div class="stat">
      <span id="blocked-count">0</span>
      <small>bloqueados en esta pestaña</small>
    </div>
  </div>

  <div class="switch-row">
    <span>Bloqueador activo</span>
    <label class="toggle">
      <input type="checkbox" id="master-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="actions">
    <button id="options-btn">Opciones y filtros</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
